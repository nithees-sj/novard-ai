services:
  mongo:
    # MongoDB with Atlas Search, so report vector search works locally too
    # (npm run db:vector-index). Same port as before. It keeps its data in its
    # own volumes: it cannot start on the old mongo:7 volume, which is left
    # untouched (see DOCKER_SETUP.md, "Moving your data").
    image: mongodb/mongodb-atlas-local:8.3 # tested with mongod 8.3.11
    container_name: novard-ai-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongodb_atlas_data:/data/db
      - mongodb_atlas_config:/data/configdb
    restart: unless-stopped
    # The image has its own health check (mongod and the search process).

  server:
    build:
      context: ./server
    container_name: novard-ai-server
    env_file:
      - ./server/.env
    environment:
      - PORT=5001
      - NODE_ENV=production
      # Fallback to containerized mongo or host.docker.internal if MONGO_URI in .env points to localhost
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/novard-ai?directConnection=true}
      # Sign-ins must come from the same Google OAuth client the web app is built with.
      - GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-821666149814-1cvmcovci4sgsn8ndedhlfbcg73scg0c.apps.googleusercontent.com}
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "5001:5001"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build:
      context: ./client
      args:
        - REACT_APP_API_ENDPOINT=http://localhost:5001
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID:-821666149814-1cvmcovci4sgsn8ndedhlfbcg73scg0c.apps.googleusercontent.com}
    container_name: novard-ai-client
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_atlas_data:
  mongodb_atlas_config:
  # The pre-atlas-local data (mongo:7). No longer mounted; kept so nothing is lost.
  mongodb_data:
